name: Daily Tech News Fetch & Deploy

on:
  schedule:
    # 每 4 小时全自动触发抓取全球最新科技要闻与大模型天梯榜 (UTC 0,4,8,12,16,20)
    - cron: '0 */4 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面随时手动点击立即运行

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行自动抓取与清洗脚本
        run: |
          python fetch_news.py

      - name: 提交更新后的 news_data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add news_data.json
          git commit -m "Auto Update: 实时科技资讯与大模型天梯榜更新 $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push

      - name: 自动部署到 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: update-news
    runs-on: ubuntu-latest
    steps:
      - name: 发布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
